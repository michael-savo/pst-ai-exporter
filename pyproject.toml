[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pst-ai-exporter"
version = "0.3.0"
description = "Local PST, MBOX, and EML exporter for AI analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PST AI Exporter contributors" }]
dependencies = []

[project.scripts]
pst-ai-exporter = "pst_ai_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
